    <path d="M722,135 C722,126 730,126 740,126 C750,126 758,126 758,135 L760,250 L720,250 Z" fill="#334155"/>
    
    <!-- Member 12 -->
    <circle cx="780" cy="110" r="13" fill="#1e293b"/>
    <path d="M763,129 C763,121 771,121 780,121 C789,121 797,121 797,129 L799,250 L761,250 Z" fill="#1e293b"/>
  </g>
  
  <!-- Subtle Metamaterial Waves at the Bottom Border -->
  <path d="M-100,430 Q100,380 300,420 T700,400 T1100,430 T1500,410 L1500,500 L-100,500 Z" fill="url(#accentGrad)"/>
