<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fff8f8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff0f1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e40428" stop-opacity="0.05"/>
      <stop offset="30%" stop-color="#e40428" stop-opacity="0.01"/>
      <stop offset="70%" stop-color="#e40428" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#e40428" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#e40428" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Content Background -->
  <rect width="1200" height="500" fill="url(#roseGrad)"/>
  <rect width="1200" height="500" fill="url(#centerGlow)"/>
  
  <!-- Subtle Metamaterial Grid Pattern Overlay -->
  <g opacity="0.35">
    <path d="M0,50 L1200,50 M0,100 L1200,100 M0,150 L1200,150 M0,200 L1200,200 M0,250 L1200,250 M0,300 L1200,300 M0,350 L1200,350 M0,400 L1200,400 M0,450 L1200,450" stroke="#f6cacd" stroke-width="0.3" stroke-dasharray="3,6"/>
    <path d="M100,0 L100,500 M200,0 L200,500 M300,0 L300,500 M400,0 L400,500 M500,0 L500,500 M600,0 L600,500 M700,0 L700,500 M800,0 L800,500 M900,0 L900,500 M1000,0 L1000,500 M1100,0 L1100,500" stroke="#f6cacd" stroke-width="0.3" stroke-dasharray="3,6"/>
  </g>
  
  <!-- Abstract Team Silhouettes & Banner Frame (Matching the uploaded group photo exactly) -->
  <g opacity="0.14" transform="translate(100, 110)">
    <!-- Research Banner Frame -->
    <rect x="180" y="30" width="640" height="15" rx="4" fill="#e40428" opacity="0.15"/>
    <rect x="250" y="240" width="120" height="60" rx="3" fill="#e2e8f0" opacity="0.6"/> <!-- Left boxes (경품함 등) -->
    <rect x="260" y="210" width="100" height="40" rx="2" fill="#cbd5e1" opacity="0.5"/>
    
    <!-- Group representation aligning with the photo of (~11-12 researchers) -->
